<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://gbhhsbmxdkpoejuvkgos.supabase.co https://www.googleapis.com https://oauth2.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Snapdoc</title>
<style>
  :root { --bg: #f5f3ee; --ink: #1e1c19; --muted: #8a847b; --accent: #0f766e; --accent-dark: #0b5c56; --accent-bg: #e3f1ee; --card: #fff; --line: #e8e3da; --danger: #b4433a; --danger-bg: #fbe9e6; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior-y: none; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.4; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; background: var(--bg); }
  .col { width: 100%; max-width: 480px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .top { display: flex; align-items: center; gap: 10px; padding: max(env(safe-area-inset-top), 12px) 16px 6px; min-height: 56px; }
  .top h1 { font-size: 21px; font-weight: 700; line-height: 1.2; }
  .subline { font-size: 12px; color: var(--muted); min-height: 16px; padding: 0 16px 8px; }
  #syncline { cursor: pointer; }
  .subline.err { color: var(--danger); }
  .pill { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); color: var(--muted); font-size: 13px; }
  .icon { width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; font-size: 22px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .icon:active { background: var(--line); }
  .scroll { flex: 1; overflow-y: auto; padding: 4px 16px 170px; -webkit-overflow-scrolling: touch; }
  .empty { color: var(--muted); font-size: 15px; text-align: center; padding: 60px 20px; line-height: 1.5; }
  .empty b { color: var(--ink); display: block; font-size: 17px; margin-bottom: 6px; }

  /* home: document cards */
  .card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; user-select: none; }
  .card:active { background: #faf8f4; }
  .card .th { width: 52px; height: 68px; border-radius: 6px; background: #ece8e0; object-fit: cover; flex: none; border: 1px solid var(--line); }
  .card .body { flex: 1; min-width: 0; }
  .card .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card .cloud { font-size: 13px; color: var(--muted); flex: none; min-width: 22px; text-align: right; }
  .card .cloud.ok { color: var(--accent); }
  .card .cloud.busy { color: #b7791f; }
  /* search and multi-select on the home list */
  .searchrow { display: flex; gap: 8px; padding: 0 16px 8px; align-items: center; }
  .searchrow input { flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); padding: 0 14px; font-size: 15px; }
  .searchrow input:focus { outline: none; border-color: var(--accent); }
  .searchrow .pill.on { background: var(--accent); color: #fff; border-color: transparent; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--accent-bg); }
  .card .tick { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; font-weight: 700; }
  .card.sel .tick { background: var(--accent); border-color: var(--accent); }
  .card.sel .tick::after { content: '✓'; }
  #selDock .secondary { padding: 0 12px; }
  #selDock .del { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
  .card { touch-action: pan-y; -webkit-touch-callout: none; }

  /* thumb zone */
  .dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; padding: 14px 16px calc(env(safe-area-inset-bottom) + 18px); z-index: 4; display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(to top, var(--bg) 70%, rgba(245,243,238,0)); }
  .fab { width: 84px; height: 84px; border-radius: 50%; border: none; background: var(--accent); color: #fff; box-shadow: 0 10px 28px rgba(15,118,110,.4); display: flex; align-items: center; justify-content: center; }
  .fab:active { transform: scale(.96); }
  .fab svg { width: 38px; height: 38px; }
  .primary { flex: 1; height: 56px; border: none; border-radius: 16px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 8px 22px rgba(15,118,110,.3); }
  .primary:active { background: var(--accent-dark); }
  .primary:disabled { opacity: .5; box-shadow: none; }
  .secondary { height: 56px; padding: 0 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); font-size: 16px; font-weight: 600; }
  .secondary:active { background: #f3efe8; }

  /* document view */
  #docName { flex: 1; min-width: 0; height: 44px; border: 1px solid transparent; border-radius: 12px; background: transparent; padding: 0 10px; font-size: 17px; font-weight: 600; }
  #docName:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .page { margin-bottom: 10px; }
  .pimg { position: relative; background: #e9e5de; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); min-height: 120px; }
  .pimg img { display: block; width: 100%; height: auto; }
  .pcap { font-size: 12px; color: var(--muted); text-align: center; padding: 5px 0 2px; }
  .pinform input { width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 0 12px; font-size: 18px; letter-spacing: .2em; margin-bottom: 8px; }
  .pimg.wait { aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
  .page.sel .pimg { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .ptools { display: none; gap: 6px; padding: 8px 0 2px; }
  .page.sel .ptools { display: flex; }
  .ptools button { flex: 1; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: 14px; font-weight: 600; }
  .ptools button.del { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
  .spin { width: 28px; height: 28px; border: 3px solid #d9d3c8; border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* camera */
  #cam { background: #000; color: #fff; }
  #cam .stage { position: relative; flex: 1; width: 100%; max-width: none; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #camOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #camMsg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px; text-align: center; color: #ddd; font-size: 15px; line-height: 1.5; }
  #camMsg button { height: 48px; padding: 0 20px; border-radius: 14px; border: none; background: #fff; color: #000; font-weight: 600; }
  .camtop { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: max(env(safe-area-inset-top), 10px) 10px 8px; z-index: 2; }
  .camtop .icon { color: #fff; font-size: 24px; }
  .camtop .icon:active { background: rgba(255,255,255,.15); }
  .seg { display: flex; background: rgba(255,255,255,.14); border-radius: 20px; padding: 3px; }
  .seg button { height: 34px; padding: 0 16px; border: none; border-radius: 17px; background: transparent; color: #ddd; font-size: 14px; font-weight: 600; }
  .seg button.on { background: #fff; color: #000; }
  .camright { display: flex; align-items: center; gap: 2px; min-width: 44px; justify-content: flex-end; }
  .autobtn { height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #ddd; font-size: 13px; font-weight: 700; }
  .autobtn.on { background: #2dd4bf; border-color: #2dd4bf; color: #06302c; }
  #camHint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6); color: #fff; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 16px; white-space: nowrap; pointer-events: none; z-index: 2; }
  .cambot { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 18px calc(env(safe-area-inset-bottom) + 22px); z-index: 2; }
  .cambot .side { min-height: 56px; display: flex; align-items: center; min-width: 0; }
  .cambot .side:last-child { justify-content: flex-end; }
  #gallery { width: 56px; height: 56px; border-radius: 14px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; display: flex; align-items: center; justify-content: center; }
  #shutter { width: 84px; height: 84px; border-radius: 50%; border: 5px solid #fff; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; }
  #shutter::after { content: ''; width: 64px; height: 64px; border-radius: 50%; background: #fff; }
  #shutter:active::after { transform: scale(.9); }
  #shutter:disabled { opacity: .4; }
  #done { height: 56px; padding: 0 10px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  #done img { width: 30px; height: 40px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(255,255,255,.5); flex: none; }
  #flashFx { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 3; }
  #flashFx.on { animation: flash .22s ease-out; }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

  /* page editor */
  #edit { background: #15140f; color: #fff; }
  #edit .top { width: 100%; max-width: 480px; }
  #edit .top .icon { color: #fff; }
  #edit .title { flex: 1; text-align: center; font-weight: 600; }
  #edit .stage { position: relative; flex: 1; width: 100%; max-width: 480px; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #cropCanvas, #filterCanvas { max-width: 100%; max-height: 100%; touch-action: none; }
  .chips { width: 100%; max-width: 480px; display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
  .chips button { flex: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; font-size: 14px; font-weight: 600; }
  .chips button.on { background: #fff; color: #000; }
  .editbot { width: 100%; max-width: 480px; display: flex; gap: 10px; padding: 4px 16px calc(env(safe-area-inset-bottom) + 18px); }
  .editbot .secondary { background: rgba(255,255,255,.12); border-color: transparent; color: #fff; }

  /* sheet (settings), popups, lock, toast */
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(30,28,25,.45); display: none; align-items: flex-end; justify-content: center; }
  .sheet.open { display: flex; }
  .panel { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 14px 18px calc(env(safe-area-inset-bottom) + 22px); }
  .panel h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .panel h2:first-child { margin-top: 4px; }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: #d8d2c7; margin: 0 auto 10px; }
  .panel p { font-size: 15px; color: var(--ink); line-height: 1.45; margin-bottom: 8px; }
  .panel .hint { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 6px 0; }
  .panel input[type=email], .panel input[type=password], .panel select { width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 0 12px; font-size: 16px; margin-bottom: 8px; }
  .panel .btn { width: 100%; height: 50px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .panel .btn.primary { background: var(--accent); color: #fff; border-color: transparent; box-shadow: none; }
  .panel .btn.quiet { background: transparent; border-color: transparent; color: var(--muted); font-weight: 500; }
  .panel .btn.danger { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
  .statecard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .statecard.err { border-color: #efc7c2; background: var(--danger-bg); }
  .statecard .t { font-weight: 700; font-size: 15px; }
  .statecard .s { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .rowopt { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; font-size: 15px; }
  .rowopt select { width: auto; margin: 0; min-width: 150px; }
  .version { font-size: 13px; color: var(--muted); text-align: center; margin-top: 14px; }
  .vtag { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }

  .popup { position: fixed; inset: 0; z-index: 45; background: rgba(30,28,25,.45); display: none; align-items: center; justify-content: center; padding: 20px; }
  .popup.open { display: flex; }
  .popup .box { width: 100%; max-width: 360px; background: var(--bg); border-radius: 20px; padding: 20px 18px 14px; }
  .popup .box h3 { font-size: 18px; margin-bottom: 6px; }
  .popup .box p { font-size: 15px; color: var(--muted); line-height: 1.45; margin-bottom: 14px; }
  .popup .box button { width: 100%; height: 50px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .popup .box button.primary { background: var(--accent); color: #fff; border-color: transparent; box-shadow: none; }
  .popup .box button.danger { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
  .popup .box button.quiet { background: transparent; border-color: transparent; color: var(--muted); font-weight: 500; margin-bottom: 0; }

  #lock { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px; text-align: center; }
  #lock .logo { width: 84px; height: 84px; border-radius: 24px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 8px; }
  #lock h2 { font-size: 22px; }
  #lock p { color: var(--muted); font-size: 15px; max-width: 300px; line-height: 1.5; }
  #lock .btn { width: 100%; max-width: 320px; height: 56px; border: none; border-radius: 16px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; }
  #lock input { width: 100%; max-width: 320px; height: 52px; border: 1px solid var(--line); border-radius: 14px; text-align: center; font-size: 20px; letter-spacing: .15em; background: var(--card); }
  #lock .quiet { background: transparent; border: none; color: var(--muted); font-size: 14px; padding: 10px; }
  #lockErr { color: var(--danger); font-size: 14px; min-height: 18px; }

  .okbtn { height: 40px; padding: 0 18px; border: none; border-radius: 20px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; flex: none; }
  .okbtn:active { background: var(--accent-dark); }
  .secondary:disabled { opacity: .45; }
  .hint.warn { color: var(--danger); }
  /* the page that was just captured: large, at once, with a button to adjust its crop; then it flies to the Done button */
  #camPeek { position: absolute; inset: 0; z-index: 2; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #camPeek img { display: block; width: auto; height: auto; max-width: 88%; max-height: 72%; border-radius: 8px; background: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.6); border: 2px solid #2dd4bf; pointer-events: auto; }
  #camPeek .pkrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #camPeek span { display: inline-block; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 12px; }
  #camPeekFix { height: 44px; padding: 0 18px; border: none; border-radius: 22px; background: #fff; color: #000; font-size: 15px; font-weight: 700; pointer-events: auto; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  #camPeekFix:disabled { opacity: .7; }
  #camPeek.go { animation: peek 2.2s cubic-bezier(.2,.8,.2,1) forwards; }      /* its length = PEEK_MS in app-cam.js */
  @keyframes peek { 0% { opacity: 0; transform: scale(.86); } 5% { opacity: 1; transform: scale(1); } 84% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translate(36%, 52%) scale(.12); } }
  /* "Adjust crop" on every page of the document */
  .pfix { position: absolute; top: 8px; right: 8px; height: 40px; padding: 0 14px; border: none; border-radius: 20px; background: rgba(30,28,25,.8); color: #fff; font-size: 13px; font-weight: 700; }
  .pfix:active { background: rgba(30,28,25,.95); }
  .pbadge { position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 7px; background: rgba(30,28,25,.74); color: #fff; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 12px; }
  .spin.sm { width: 14px; height: 14px; border-width: 2px; margin-right: 0; border-color: rgba(255,255,255,.35); border-top-color: #fff; }
  #away { position: fixed; inset: 0; z-index: 55; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px; text-align: center; }
  #away .logo { width: 84px; height: 84px; border-radius: 24px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 8px; }
  #away h2 { font-size: 21px; max-width: 320px; }
  #away p { color: var(--muted); font-size: 15px; max-width: 300px; line-height: 1.5; }
  #away .btn { width: 100%; max-width: 320px; height: 56px; border: none; border-radius: 16px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 130px); transform: translateX(-50%); z-index: 50; background: rgba(30,28,25,.92); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 15px; display: none; align-items: center; gap: 14px; max-width: 92vw; }
  #toast.show { display: flex; }
  #toast button { height: 36px; padding: 0 12px; border: none; border-radius: 10px; background: #fff; color: #000; font-weight: 700; font-size: 14px; }
  .busybar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); z-index: 60; transform-origin: left; animation: busy 1.2s ease-in-out infinite; display: none; }
  .busybar.on { display: block; }
  @keyframes busy { 0% { transform: scaleX(0); } 50% { transform: scaleX(.7); } 100% { transform: scaleX(1); opacity: 0; } }
</style>
</head>
<body>
<div class="busybar" id="busy"></div>

<section id="home" class="screen">
  <div class="col">
    <header class="top">
      <div style="flex:1;min-width:0"><h1>Snapdoc <span id="vtag" class="vtag"></span></h1></div>
      <button id="menuBtn" class="pill">Menu</button>
    </header>
    <div id="syncline" class="subline"></div>
    <div class="searchrow" id="searchRow" hidden>
      <input id="searchBox" type="search" autocomplete="off" placeholder="Search" aria-label="Search documents">
      <button id="selectBtn" class="pill">Select</button>
    </div>
    <div id="list" class="scroll"></div>
  </div>
  <div class="dock" id="scanDock">
    <button id="scanBtn" class="fab" aria-label="Scan a document">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
    </button>
  </div>
  <div class="dock" id="selDock" hidden>
    <button id="selShare" class="primary">Share</button>
    <button id="selSave" class="secondary">Save</button>
    <button id="selDelete" class="secondary del">Delete</button>
    <button id="selCancel" class="secondary">Cancel</button>
  </div>
</section>

<section id="doc" class="screen" hidden>
  <div class="col">
    <header class="top">
      <button id="docBack" class="icon" aria-label="Back">←</button>
      <input id="docName" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" aria-label="Document name">
      <button id="docOk" class="okbtn" aria-label="Save the name" hidden>OK</button>
      <button id="docMore" class="icon" aria-label="More">⋯</button>
    </header>
    <div id="docMeta" class="subline"></div>
    <div id="pages" class="scroll"></div>
  </div>
  <div class="dock">
    <button id="shareBtn" class="primary">Share PDF</button>
    <button id="addBtn" class="secondary">+ Pages</button>
  </div>
</section>

<section id="edit" class="screen" hidden>
  <header class="top">
    <button id="editCancel" class="icon" aria-label="Cancel">✕</button>
    <div class="title" id="editTitle">Adjust corners</div>
    <button id="editAuto" class="icon" aria-label="Find edges again" title="Find edges again">⟲</button>
  </header>
  <div class="stage">
    <canvas id="cropCanvas"></canvas>
    <canvas id="filterCanvas" hidden></canvas>
  </div>
  <div class="chips" id="editChips"></div>
  <div class="editbot">
    <button id="editBack" class="secondary" hidden>Corners</button>
    <button id="editRotL" class="secondary" hidden title="Rotate left">↺</button>
    <button id="editRotR" class="secondary" hidden title="Rotate right">↻</button>
    <button id="editNext" class="primary">Next</button>
  </div>
</section>

<section id="cam" class="screen" hidden>
  <div class="camtop">
    <button id="camClose" class="icon" aria-label="Close camera">✕</button>
    <div class="seg"><button id="modeSingle">Single</button><button id="modeBatch">Batch</button></div>
    <div class="camright"><button id="autoBtn" class="autobtn" aria-label="Automatic capture">Auto</button><button id="torchBtn" class="icon" aria-label="Flash" hidden>⚡</button></div>
  </div>
  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="camOverlay"></canvas>
    <div id="camHint" hidden></div>
    <div id="camMsg" hidden></div>
    <div id="camPeek" hidden><img id="camPeekImg" alt=""><div class="pkrow"><span id="camPeekLbl"></span><button id="camPeekFix">Adjust crop</button></div></div>
    <div id="flashFx"></div>
  </div>
  <div class="cambot">
    <div class="side"><button id="gallery" aria-label="Import from photos" title="Import from photos"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 15.5l-4.5-4.5L7 20"/></svg></button></div>
    <button id="shutter" aria-label="Take photo"></button>
    <div class="side"><button id="done" hidden><img id="doneThumb" alt="" hidden><span id="doneLbl">Done</span></button></div>
  </div>
</section>

<div id="sheet" class="sheet"><div class="panel" id="panel"></div></div>
<div id="popup" class="popup"><div class="box" id="popupBox"></div></div>
<div id="lock" hidden>
  <div class="logo">🔒</div>
  <h2>Snapdoc is locked</h2>
  <p id="lockText">Unlock with your fingerprint or screen lock.</p>
  <input id="pinInput" type="password" autocomplete="off" placeholder="PIN" hidden>
  <button id="unlockBtn" class="btn">Unlock</button>
  <div id="lockErr"></div>
  <button id="lockReset" class="quiet">Can't unlock? Reset this app</button>
</div>
<div id="away" hidden>
  <div class="logo">⧉</div>
  <h2>Snapdoc is open in another tab or window</h2>
  <p>Only one can be active at a time, so that nothing gets overwritten.</p>
  <button id="awayBtn" class="btn">Use Snapdoc here</button>
</div>
<div id="toast"></div>
<input type="file" id="importInput" accept="image/*" multiple hidden>

<script src="config.js"></script>
<script src="imaging.js"></script>
<script src="vault.js"></script>
<script src="app-core.js"></script>
<script src="app-docs.js"></script>
<script src="app-cam.js"></script>
<script src="app-lock.js"></script>
<script src="app-sync.js"></script>
<script src="app-drive.js"></script>
<script src="app-boot.js"></script>
</body>
</html>
